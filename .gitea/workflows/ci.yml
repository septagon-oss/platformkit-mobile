# Verify the SDK, source, tests and native fingerprint in an isolated job
# container, then prove both bundles compile, the dependency tree carries no
# high advisory and the history carries no secret. Nothing here builds a
# binary (android.yml) or needs a credential.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pkit-ci-linux-amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          # The secret scan reads history, not one tree.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: ''
      - run: npm ci --no-audit --no-fund
      - run: npm run check

      - name: Both bundles compile
        run: npm run export:check

      - name: No high or critical advisory
        run: npm audit --audit-level=high

      - name: No secret in the history
        run: |
          tools=$(mktemp -d)
          trap 'rm -rf "$tools"' EXIT
          curl -fsSLo "$tools/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          (cd "$tools" && echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -)
          tar -xzf "$tools/gitleaks.tar.gz" -C "$tools" gitleaks
          "$tools/gitleaks" git --no-banner --redact .

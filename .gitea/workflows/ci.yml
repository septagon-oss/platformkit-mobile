# Verify the SDK, source, tests and native fingerprint in an isolated job
# container, then prove both bundles compile, that every high advisory the
# dependency tree carries has been reviewed and none is critical, and that the
# history carries no secret. Nothing here builds a binary (android.yml) or needs
# a credential.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pkit-ci-linux-amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          # The secret scan reads history, not one tree.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: ''
      - run: npm ci --no-audit --no-fund

      # The contract tier, first: one process per pinned document, generated client,
      # published surface, native fingerprint, flow set and suite inventory. Minutes, and
      # the answer a person wants before the suites finish (0088 rule 5).
      - name: The wire, the manifest and the suite's own record
        run: npm run test:contracts

      # 0088 rule 5's push tier names the behaviour and composition tests the change
      # reaches, read from the imports the suites actually take. It adds work and never
      # replaces it: the required check below runs both suites undiscovered-scoped on
      # every push and every pull request, whatever this step selected.
      - name: The tests this change reaches
        env:
          PK_BASE: ${{ github.base_ref || github.event.before }}
        run: |
          if git rev-parse -q --verify "$PK_BASE^{commit}" >/dev/null 2>&1; then base="$PK_BASE"; else base=origin/main; fi
          echo "scoping the push tier to the change against $base"
          npm run test:scope -- "$base" --run

      - run: npm run check

      - name: Both bundles compile
        run: npm run export:check

      # The blocking half of the dependency-advisory rule: every high filing
      # needs a dated review in advisories.json, a critical one needs a fix.
      # What the advisory database says today, reviewed or not, is the weekly
      # drift report, because that answer moves when somebody else publishes.
      - name: Every high advisory is reviewed and none is critical
        run: npm run check:advisories

      - name: No secret in the history
        run: scripts/gitleaks.sh

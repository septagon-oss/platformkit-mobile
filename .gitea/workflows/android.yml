# The Android binary, built when what a binary is made of changed. The
# recipe is scripts/android/build.sh inside the pinned build image
# (Dockerfile.android); the output is an unsigned arm64 APK of the
# verification profile, kept for two weeks as a run artifact. No credential
# is involved and nothing is published; the release workflow does that.
name: android

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - fingerprint.json
      - app.config.ts
      - package-lock.json
      - Dockerfile.android
      - .dockerignore
      - scripts/android/**
      - .gitea/workflows/android.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # This build needs about 6 GiB of memory. One architecture, built serially
    # with the settings in scripts/android/, peaks at 4.1 GiB on its own, and a
    # job shares its allowance with the builder that runs it: at 4 GiB the
    # Gradle daemon was killed, and at 6 GiB a cold job builds in about seven
    # and a half minutes. Give the verification environment the memory, then
    # set the repository variable ANDROID_BUILD to "on" to run this job.
    if: >-
      vars.ANDROID_BUILD == 'on' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: pkit-ci-linux-amd64
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Build the verification APK
        run: |
          docker build -f Dockerfile.android --target out \
            --build-arg ABIS=arm64-v8a --build-arg PK_PROFILE=ci \
            --output type=local,dest=out .
          ls -la out/apk/release/
          (cd out/apk/release && sha256sum *.apk)

      # v4: its artifact client speaks the Actions results API, which the forge
      # this runs on (Gitea 1.22 and later, runner 3.x) serves; v3 spoke the
      # API github.com has since retired. The GitHub workflow uploads nothing,
      # so nothing here is held back by it. The pin is the v4.6.2 tag's commit.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platformkit-mobile-ci-arm64-${{ github.sha }}
          path: out/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

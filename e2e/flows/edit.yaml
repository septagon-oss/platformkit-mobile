# An edit: the sheet opens holding what the record says, Cancel changes nothing,
# and what is saved is what the record says afterwards.
# screen: app/[module]/[entity]/[id]/edit.tsx
appId: ${APP_ID}
env:
  APP_ID: dev.septagon.platformkit.ci
---
- runFlow: sign-in.yaml
- tapOn:
    id: "open-${MODULE}-${ENTITY}"
- extendedWaitUntil:
    visible:
      id: "resource-list"
    timeout: 15000
- tapOn: "New"
- tapOn:
    id: "input-${KNOWN}"
- inputText: ${TITLE} edit
- hideKeyboard
- tapOn:
    id: "save"
- extendedWaitUntil:
    visible:
      id: "resource-detail"
    timeout: 15000
- tapOn: "Edit"
- assertVisible: "Edit ${ENTITY}"
- assertVisible:
    id: "resource-form"
- assertVisible: ${TITLE} edit
- tapOn: "Cancel"
- extendedWaitUntil:
    visible:
      id: "resource-detail"
    timeout: 15000
- assertVisible: ${TITLE} edit
- tapOn: "Edit"
- tapOn:
    id: "input-${KNOWN}"
- eraseText
- inputText: ${TITLE} amended
- hideKeyboard
- tapOn:
    id: "save"
- extendedWaitUntil:
    visible: ${TITLE} amended
    timeout: 15000
- assertVisible:
    id: "resource-detail"
- assertNotVisible: ${TITLE} edit
- tapOn:
    id: "record-menu"
- scrollUntilVisible:
    element:
      id: "delete"
- tapOn:
    id: "delete"
- tapOn: (?i)^Delete [^‘’?]+$
- extendedWaitUntil:
    visible:
      id: "resource-list"
    timeout: 15000
- assertNotVisible: ${TITLE} amended

# The list a generated entry opens: the door that makes a record of its own, a row
# of its own, that the row opens the record it names, and that the two controls under
# the header change how the list is read. The row is created here, named after this
# journey, and deleted by the end of it. The controls are asserted only once a row
# exists: a list with nothing on it and nothing filtered offers neither of them.
# screen: app/[module]/[entity]/index.tsx
appId: ${APP_ID}
env:
  APP_ID: dev.septagon.platformkit.ci
---
- runFlow: sign-in.yaml
- tapOn:
    id: "open-${MODULE}-${ENTITY}"
- extendedWaitUntil:
    visible:
      id: "resource-list"
    timeout: 15000
- assertVisible: "New"
- tapOn: "New"
- assertVisible:
    id: "resource-form"
- tapOn:
    id: "input-${KNOWN}"
- inputText: ${TITLE} list
- hideKeyboard
- tapOn:
    id: "save"
- extendedWaitUntil:
    visible:
      id: "resource-detail"
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: "resource-list"
    timeout: 15000
- assertVisible: ${TITLE} list
# The two doors under the header: the order the list reads in, and what it is narrowed
# by. Choosing an order is the whole answer, so the sheet goes with the choice; the
# filters sheet stays open until the person leaves it.
- assertVisible: "Sort"
- tapOn: "Sort"
- assertVisible: "Newest first"
- tapOn: "Oldest first"
- assertNotVisible: "Newest first"
- assertVisible: "Filters"
- tapOn: "Filters"
- assertVisible: "All"
- back
- assertNotVisible: "All"
- tapOn: ${TITLE} list
- assertVisible:
    id: "resource-detail"
- tapOn:
    id: "record-menu"
- scrollUntilVisible:
    element:
      id: "delete"
- tapOn:
    id: "delete"
- tapOn: (?i)^Delete [^‘’?]+$
- extendedWaitUntil:
    visible:
      id: "resource-list"
    timeout: 15000
- assertNotVisible: ${TITLE} list

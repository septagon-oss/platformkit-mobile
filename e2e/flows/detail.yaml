# One record as a screen: what it is and what distinguishes it first, its fields
# that have values, and its own identifier kept in the collapsed Record information
# until it is asked for. The record is made here and deleted by the end of the
# journey, through the header's `…`.
# screen: app/[module]/[entity]/[id]/index.tsx
appId: ${APP_ID}
env:
  APP_ID: dev.septagon.platformkit.ci
---
- runFlow: sign-in.yaml
- tapOn:
    id: "open-${MODULE}-${ENTITY}"
- extendedWaitUntil:
    visible:
      id: "resource-list"
    timeout: 15000
- tapOn: "New"
- tapOn:
    id: "input-${KNOWN}"
- inputText: ${TITLE} record
- hideKeyboard
- tapOn:
    id: "save"
- extendedWaitUntil:
    visible:
      id: "resource-detail"
    timeout: 15000
- assertVisible: ${TITLE} record
- assertVisible: "Edit"
# The record's own plumbing waits in one collapsed block: when it was made is there
# to be read, and nowhere on the screen before the person asks for it.
- assertVisible:
    id: "record-information"
- assertNotVisible: "Created at"
- tapOn:
    id: "record-information"
- assertVisible: "Created at"
# Delete is the header's `…`, which opens a row, and the row opens the question that
# carries the warning: the sentence is on no screen until that tap. The answer carries
# the record's own noun ("Delete note", "Delete task"), which a journey that names the
# served resource through ${ENTITY} cannot spell, so the journey matches the word and a
# noun — case-insensitively, because a dialog may set its buttons in capitals — and
# never the question above it, which is the same word and a quoted name.
- tapOn:
    id: "record-menu"
- scrollUntilVisible:
    element:
      id: "delete"
- tapOn:
    id: "delete"
- assertVisible: "You can’t undo this in the app."
- tapOn: "/(?i)^Delete [^‘’?]+$/"
- extendedWaitUntil:
    visible:
      id: "resource-list"
    timeout: 15000
- assertNotVisible: ${TITLE} record

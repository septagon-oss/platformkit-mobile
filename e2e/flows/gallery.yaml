# The library on one screen, in both modes. The gallery route exists only in
# the verification profile, which is the build these flows run on.
# screen: app/gallery.tsx
appId: ${APP_ID}
env:
  APP_ID: dev.septagon.platformkit.ci
---
- launchApp
# A link that arrives while the app is still starting is lost; let it settle first.
- waitForAnimationToEnd:
    timeout: 5000
- openLink: platformkit://gallery
- extendedWaitUntil:
    visible:
      id: "gallery"
    timeout: 10000
- assertVisible: "Display, the serif"
- tapOn:
    id: "gallery-mode"
- tapOn: "Dark"
- assertVisible: "Body, the system face"
- scrollUntilVisible:
    element: "A row that opens"
# The shared rich states use the same native controls and gallery in each mode.
- scrollUntilVisible:
    element:
      id: "gallery-case"
    direction: UP
- tapOn:
    id: "gallery-case"
- tapOn: "empty-state/with-action"
- assertVisible: "Nothing here yet"
- tapOn: "Add an item"
- assertVisible: "Action received: add"
- tapOn:
    id: "gallery-case"
- scrollUntilVisible:
    element: "notice/write-unknown"
- tapOn: "notice/write-unknown"
- assertVisible: "Check the result"
- assertNotVisible: "Retry"
- tapOn:
    id: "gallery-language"
- tapOn: "Português"
- assertVisible: "Verificar o resultado"
- tapOn:
    id: "gallery-mode"
- tapOn: "Claro"
- tapOn:
    id: "gallery-case"
- scrollUntilVisible:
    element: "notice/success-action"
- tapOn: "notice/success-action"
- assertVisible: "A alteração foi guardada."
- tapOn: "Fechar"
- assertVisible: "Ação recebida: dismiss"
- tapOn:
    id: "gallery-case"
- scrollUntilVisible:
    element: "skeleton/reduced-motion"
- tapOn: "skeleton/reduced-motion"
- assertVisible: "A carregar"
# Representative shared-family interactions; the callback receipt is derived copy.
- tapOn:
    id: "gallery-case"
- scrollUntilVisible:
    element: "quantity-control/middle"
    direction: UP
- tapOn: "quantity-control/middle"
- tapOn: "Aumentar: Quantidade"
- assertVisible:
    id: "gallery-kit-action"
- tapOn:
    id: "gallery-case"
- scrollUntilVisible:
    element: "plan-comparison/unknown"
- tapOn: "plan-comparison/unknown"
- scrollUntilVisible:
    element: "Desconhecido"
- assertVisible: "Desconhecido"

# The account menu in the header, and out: the door belongs to the home screen.
# screen: app/index.tsx
appId: ${APP_ID}
env:
  APP_ID: dev.septagon.platformkit.ci
---
- runFlow: sign-in.yaml
- tapOn:
    id: "account"
- tapOn: "Sign out"
- extendedWaitUntil:
    visible:
      id: "sign-in"
    timeout: 10000

# Appended to the template's gradle.properties by scripts/android/build.sh,
# so these win. The build has to fit a 2-CPU, 4 GiB job: one Gradle JVM of
# modest size, Kotlin compiled in that process rather than in a daemon of its
# own, no parallel project execution, two workers. The Kotlin compiler lives
# in Metaspace, and a cold compile of react-native-screens ran out of it at
# 384 MiB; 768 MiB is what it needs. The template's settings plus a Kotlin
# daemon plus Metro did not fit the 4 GiB at all.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m

# Appended to the template's gradle.properties by scripts/android/build.sh,
# so these win. The build has to fit a 2-CPU, 4 GiB job: one Gradle JVM of
# modest size, Kotlin compiled in that process rather than in a daemon of its
# own, no parallel project execution, one worker. The Kotlin compiler lives
# in Metaspace, and a cold compile of react-native-screens ran out of it at
# 384 MiB; 768 MiB is what it needs. Two workers plus that Metaspace peaked
# at the 4 GiB ceiling on a bare docker run and lost the daemon to the OOM
# killer in a real job, where BuildKit shares the same allowance, so the
# build is serial and leaves room: measured under a 3 GiB ceiling.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.vfs.watch=false
org.gradle.caching=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m
